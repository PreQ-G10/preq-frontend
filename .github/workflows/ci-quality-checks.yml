name: CI - Quality Checks

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main

jobs:

  # JOB 1 — Checkout & cache (runs once)
  prepare:
    name: Checkout & Cache
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .
          include-hidden-files: true

  # JOB 2 — Linting (ESLint)
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

  # JOB 3 — TypeScript check
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript check
        run: npx --no-install tsc --noEmit

  # JOB 4 — Tests & Coverage
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Jest (components)
        run: npm run test:components -- --watchAll=false --passWithNoTests --coverage --coverageDirectory=coverage/jest

      - name: Run Vitest (unit)
        run: npm run test:coverage -- --coverage.reportsDirectory=coverage/vitest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/jest/lcov.info,coverage/vitest/lcov.info
          fail_ci_if_error: false

  # JOB 5 — Security Scan (Trivy)
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt