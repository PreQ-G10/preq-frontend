name: CI - Quality Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:

  # JOB 1 — Checkout & cache (runs once)
  prepare:
    name: Checkout & Cache
    runs-on: ubuntu-latest
    needs: guard

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: .

  # JOB 2 — Linting (ESLint)
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run ESLint
        run: npm run lint

      - name: Upload ESLint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-results
          path: eslint-report.json

  # JOB 3 — TypeScript check
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # JOB 4 — Unit Tests (Jest)
  test:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: coverage/

  # JOB 5 — Security Scan (Trivy)
  security:
    name: Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read

    steps:
      - name: Download workspace
        uses: actions/download-artifact@v4
        with:
          name: workspace

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          output: 'trivy-results.txt'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.txt